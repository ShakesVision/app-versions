<!DOCTYPE html>
<html lang="{{direction}}" dir="{{direction}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=3.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../shared/utils.css">
    <link rel="stylesheet" href="styles/pdf.css">
    <style>
        :root {
            --primary-color: {{colors.primary}};
            --background-color: {{colors.background}};
            --toolbar-color: {{colors.toolbar}};
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="toolbar" id="toolbar">
        <div class="toolbar-title">{{title}}</div>
        <div class="toolbar-actions">
            <button class="icon-btn" id="btnThumbnails" title="Thumbnails">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 5v4h6V5H4zm8 0v4h6V5h-6zm-8 6v4h6v-4H4zm8 0v4h6v-4h-6zm-8 6v4h6v-4H4zm8 0v4h6v-4h-6z"/></svg>
            </button>
            <button class="icon-btn" id="btnFullscreen" title="Fullscreen">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Viewer -->
    <main class="viewer" id="viewer">
        <div class="pages-container" id="pagesContainer">
            {{#each pages}}
            <div class="page" data-page="{{@index}}">
                <img src="{{this}}" alt="Page {{@index}}" loading="lazy">
            </div>
            {{/each}}
        </div>
    </main>

    <!-- Page Navigation -->
    <nav class="page-nav" id="pageNav">
        <button class="nav-btn" id="btnPrev">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <span class="page-info">
            <span id="currentPage">1</span> / <span id="totalPages">{{pages.length}}</span>
        </span>
        <button class="nav-btn" id="btnNext">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </nav>

    <!-- Thumbnails Panel -->
    <aside class="thumbnails-panel" id="thumbnailsPanel">
        <div class="thumbnails-header">
            <span>Pages</span>
            <button class="icon-btn" id="btnCloseThumbnails">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="thumbnails-grid" id="thumbnailsGrid">
            {{#each pages}}
            <div class="thumbnail" data-page="{{@index}}">
                <img src="{{this}}" alt="Page {{@index}}">
                <span class="thumbnail-number">{{@index}}</span>
            </div>
            {{/each}}
        </div>
    </aside>

    <script src="scripts/app.js"></script>
</body>
</html>
